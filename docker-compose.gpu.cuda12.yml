version: '3.8'

services:
  transcripto-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu.cuda12
    container_name: transcripto-gpu
    ports:
      - "5001:5000"
    environment:
      - FLASK_DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - FREE_TRANSCRIPTIONS_LIMIT=${FREE_TRANSCRIPTIONS_LIMIT:-10}
      - HF_TOKEN=${HF_TOKEN}
      # Variables CUDA 12
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - uploads_data:/app/uploads
      - transcriptions_data:/app/transcripciones
      - db_data:/app/db
      - huggingface_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    shm_size: '2gb'

volumes:
  uploads_data:
  transcriptions_data:
  db_data:
  huggingface_cache:
