version: '3.8'

services:
  transcripto-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: transcripto-gpu
    ports:
      - "5001:5000"
    environment:
      - FLASK_DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - FREE_TRANSCRIPTIONS_LIMIT=${FREE_TRANSCRIPTIONS_LIMIT:-10}
      # Variables CUDA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Configuración de PyTorch para GPU
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      # Archivos subidos persistentes
      - uploads_data:/app/uploads
      - transcriptions_data:/app/transcripciones
      - db_data:/app/db
      # Caché de modelos de Hugging Face (para pyannote.audio)
      - huggingface_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    # Configuración GPU - Requiere Docker Compose v2.3+ y NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # Número de GPUs (puedes cambiar a 'all' para usar todas)
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Más tiempo para cargar modelos en GPU
    shm_size: '2gb'  # Memoria compartida para PyTorch

volumes:
  uploads_data:
  transcriptions_data:
  db_data:
  huggingface_cache:
